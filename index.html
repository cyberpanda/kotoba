function buildCard(id,s,p,free){let picked=[];const tiles=shuf(s.t.map((t,i)=>({...t,i})));const draw=()=>{M.innerHTML=`<div class="stack">${p||""}<div class="kind">Übersetze ins Japanische</div><div class="card"><div class="q de">${s.de}</div></div><div class="slot tiles" id="sl">${picked.map((t,n)=>`<button class="tile" data-n="${n}">${rb(t.j,t.k)}</button>`).join("")}</div><div class="tiles" id="pool">${tiles.map((t,n)=>picked.includes(t)?"":`<button class="tile" data-n="${n}">${rb(t.j,t.k)}</button>`).join("")}</div><div class="row"><button class="ghost" id="hint">Wörter zeigen</button><button class="big" id="chk" ${picked.length<tiles.length?"disabled style=opacity:.5":""}>Prüfen</button></div><div id="hv"></div></div>`;$("#pool").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const t=tiles[b.dataset.n];picked.push(t);if(cfg.tsay!==false)speak({"は":"わ","へ":"え"}[t.j]||t.k||t.j);draw()});$("#sl").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{picked.splice(b.dataset.n,1);draw()});$("#hint").onclick=()=>$("#hv").innerHTML=vocabRow(s);$("#chk").onclick=()=>{const ok=picked.map(t=>t.j).join("")===s.t.map(t=>t.j).join("");M.querySelector(".row").outerHTML=`<div class="card stack"><div class="kind" style="color:var(${ok?"--ok":"--bad"})">${ok?"Richtig 正解":"Richtige Reihenfolge"}</div><div class="sent">${sentHTML(s)}</div><div class="rom">${s.t.map(t=>t.r).join(" ")}</div></div>${free?`<button class="big" id="nx">Nächster Satz</button>`:ok?rateBar(id):`<button class="big fbnext" id="nx">Weiter</button>`}`;if(free)$("#nx").onclick=()=>free();else if(ok)bindRate(id);else{grade(id,0);Q.push(id);$("#nx").onclick=()=>{qi++;next()}}}};draw()}
function mine(){const ws=W.filter(w=>isM(w.id,"fav")||isM(w.id,"hard"));M.innerHTML=`<div class="stack"><h2>Meine Wörter · ${ws.length}</h2>${ws.length?`<div class="row"><button class="big" id="d1">Alle üben</button><button class="ghost" id="d2">Schwere schreiben</button></div><div class="card" style="overflow-x:auto"><table>${ws.map(w=>`<tr><td class="j">${w.j}</td><td><span class="jp">${w.k}</span><br><span style="font-family:var(--mono);font-size:12px;color:var(--acc2)">${w.r}</span></td><td>${w.d}</td><td>${isM(w.id,"fav")?"★":""}${isM(w.id,"hard")?' <span style="color:var(--bad)">⚑</span>':""}</td></tr>`).join("")}</table></div>`:`<p class="mute">Noch leer. Tippe bei einem Wort auf ★ Merken oder ⚑ Schwer, dann landet es hier.</p>`}<button class="ghost" id="bk">← Lektionen</button></div>`;$("#bk").onclick=()=>learn(-1);if(ws.length){$("#d1").onclick=()=>{Q=shuf(ws.flatMap(w=>[w.id+":jd",w.id+":dj",w.id+":wr"]));qi=0;next()};$("#d2").onclick=()=>{const h=ws.filter(w=>isM(w.id,"hard"));Q=shuf((h.length?h:ws).map(w=>w.id+":wr"));qi=0;next()}}}

function piano(n,t,v=.5,d=2.6){const c=AU.ctx,g=c.createGain();env(g,t,.006,v,d);[[1,"sine",1],[2,"triangle",.18],[3,"sine",.06]].forEach(([h,ty,a])=>{const o=c.createOscillator(),k=c.createGain();o.type=ty;o.frequency.value=mf(n)*h;k.gain.value=a;o.connect(k);k.connect(g);o.start(t);o.stop(t+d)});g.connect(AU.m)}
function koto(n,t,v=.4){const c=AU.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.setValueAtTime(mf(n)*1.012,t);o.frequency.exponentialRampToValueAtTime(mf(n),t+.08);f.type="bandpass";f.frequency.value=mf(n)*2.2;f.Q.value=1.6;env(g,t,.003,v,1.1);o.connect(f);f.connect(g);g.connect(AU.m);o.start(t);o.stop(t+1.2)}
function pad(ns,t,d,v=.07){const c=AU.ctx;ns.forEach(n=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=mf(n);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.6);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.1)})}
function kick(t){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);env(g,t,.002,.55,.3);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+.32)}
function noiseHit(t,fr,v,d,type="highpass"){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.value=fr;env(g,t,.002,v,d);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t,Math.random());s.stop(t+d+.05)}
function loopNoise(fr,v,type){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;s.loop=true;f.type=type;f.frequency.value=fr;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.m);s.start();AU.loops.push(s)}
const IN=[0,1,5,7,8],YO=[0,2,5,7,9],deg=(sc,i)=>sc[((i%5)+5)%5]+12*Math.floor(i/5);
function tick(){const c=AU.ctx,tr=AU.tr,bpm=tr==="lofi"?76:tr==="koto"?64:70,sp=60/bpm/2;while(AU.next<c.currentTime+.25){const t=AU.next,s=AU.step,bar=Math.floor(s/8),b=s%8,r=[0,3,4,2][bar%4];
if(tr==="piano"){if(b===0)piano(deg(IN,r)-12,t,.42,3.5);if(Math.random()<(b%2?.35:.7))piano(deg(IN,r+5+(Math.random()*7|0)),t,.24+Math.random()*.12);}
else if(tr==="lofi"){const sw=b%2?sp*.18:0;if(b===0)pad([deg(YO,r)-12,deg(YO,r+2)-12,deg(YO,r+4)-12,deg(YO,r+6)-12],t,sp*8);if(b===0||b===5)kick(t);if(b===4)noiseHit(t,1800,.18,.2,"bandpass");noiseHit(t+sw,7000,.045,.05);if(Math.random()<.35)piano(deg(YO,r+7+(Math.random()*6|0)),t+sw,.2,1.8);if(Math.random()<.3)noiseHit(t+Math.random()*sp,3000,.02,.02)}
else{if(Math.random()<(b===0?1:.45))koto(deg(IN,r+(b===0?0:3+(Math.random()*8|0))),t,.32);if(b===0&&bar%2===0)koto(deg(IN,r)-12,t,.3)}
AU.next+=sp;AU.step++}}
function playTrack(tr){try{if(!AU.ctx)auSetup();const c=AU.ctx,g=AU.m.gain,now=c.currentTime,vol=(cfg.vol??.5)*.32;if(tr===AU.tr&&AU.iv){c.resume();g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(vol,now+.6);return}clearTimeout(AU.ft);g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(0,now+.45);AU.ft=setTimeout(()=>{clearInterval(AU.iv);AU.iv=null;musicStopLoops();AU.tr=tr;if(!tr){c.suspend();return}c.resume();AU.next=c.currentTime+.08;AU.step=0;if(tr==="koto"||tr==="rain")loopNoise(1200,.05,"lowpass");if(tr==="lofi")loopNoise(5000,.012,"highpass");AU.iv=setInterval(tick,90);const t2=c.currentTime;g.cancelScheduledValues(t2);g.setValueAtTime(0,t2);g.linearRampToValueAtTime(vol,t2+.9)},c.state==="running"&&AU.iv?480:0)}catch(e){}}

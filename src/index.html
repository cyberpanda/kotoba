html{height:100%}body{min-height:100%}

.tgl{display:flex;gap:6px}

h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px;font-weight:600}

.q{font-family:var(--jp);font-size:40px;text-align:center;line-height:1.6;padding:14px 0;text-wrap:balance}
.q.de{font-family:var(--ui);font-size:26px;font-weight:600}
rt{font-size:.42em;color:var(--mute);font-family:var(--jp)}

.sent{font-family:var(--jp);font-size:28px;line-height:2;text-align:center}

table{width:100%;border-collapse:collapse}

.g p{line-height:1.6;margin:6px 0;max-width:65ch}

.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden}

.mute{color:var(--mute);font-size:14px;line-height:1.5}

<script>
const SND=(()=>{let ac=null,mg=null;const ok=()=>{try{const k=JSON.parse(localStorage.getItem("nj_cfg")||"{}");return k.sfx!==false&&window.KSPM!==false}catch(e){return true}};
const init=()=>{try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.55;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination)}ac.resume();return ac.state==="running"||true}catch(e){return false}};
const live=()=>ac&&ac.state==="running"&&ok();
const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};

const noise=(t,d,v,type,f,q,f2)=>{const n=Math.ceil(ac.sampleRate*(d+.05)),b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;const g=ac.createGain();env(g,t,.008,d,v);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.05)};
const P={
stamp(){const t=ac.currentTime;osc(120,t,.005,.35,.9,"sine",48);noise(t,.12,.5,"lowpass",900,.7);osc(240,t,.002,.08,.15,"triangle",120)},
brush(){const t=ac.currentTime;noise(t,.16,.18,"bandpass",2400,1.4,5200)},
koto(){const t=ac.currentTime;[587.3,698.5,784,880,1046.5].forEach((f,i)=>{osc(f,t+i*.09,.004,1.1,.16,"triangle");osc(f*2,t+i*.09,.002,.35,.04,"sine")})},
pop(){const t=ac.currentTime;osc(880,t,.004,.12,.18,"sine",1320)},
click(){const t=ac.currentTime;osc(1400,t,.003,.07,.07,"sine",1100)},
night(){const t=ac.currentTime;[1174.7,987.8,880,739.99,587.3].forEach((f,i)=>{osc(f,t+.08+i*.14,.02,1.6,.07,"sine");osc(f*2,t+.08+i*.14,.01,.6,.015,"sine")})},
day(){const t=ac.currentTime;[587.3,739.99,880,987.8,1174.7].forEach((f,i)=>{osc(f,t+.08+i*.12,.02,1.3,.07,"sine");osc(f*2,t+.08+i*.12,.01,.5,.015,"sine")})},
pad(){const t=ac.currentTime;[293.7,440,587.3,740].forEach((f,i)=>{osc(f,t+i*.04,.5,2.2,.06,"sine");osc(f*1.003,t+i*.04,.5,2.2,.04,"triangle")})},
tick(){const t=ac.currentTime;osc(1200,t,.002,.06,.1,"sine",900)}};

(()=>{const sp=document.getElementById("ksp");let first=true,de=true,c={};try{first=!localStorage.getItem("nj_welcome");c=JSON.parse(localStorage.getItem("nj_cfg")||"{}");de=c.lang?c.lang==="de":(navigator.language||"").startsWith("de");window.KSPM=c.mOn!==false}catch(e){}
const T=(a,b)=>de?a:b,$i=i=>document.getElementById(i),mu=sp.querySelector(".kmu"),th=sp.querySelector(".kth"),sw=th.querySelector(".tsw"),dk=sp.querySelector(".kdk"),tip=$i("ktip");
let gst=0;const rt=()=>{$i("ksh").textContent=T("Japanisch lernen – spielerisch, Schritt für Schritt.","Learn Japanese – playfully, step by step.");$i("ksb").innerHTML=[["📖",T("Lektionen","Lessons")],["⛩️",T("Spiele & RPG","Games & RPG")],["🗾","Offline"]].map(([i,t])=>`<div><b>${i}</b>${t}</div>`).join("");const g=$i("kgo");if(g)g.textContent=gst?T("Weiter","Continue"):T("Los geht's","Let's start");if(tip)tip.textContent=T("🌙 Hell oder dunkel? Hier umschalten – jederzeit, auch oben im Menü.","🌙 Light or dark? Switch here – anytime, also in the top menu.");sp.querySelectorAll(".klang button").forEach(b=>b.classList.toggle("on",(b.dataset.l==="de")===de))};rt();sp.querySelectorAll(".klang button").forEach(b=>b.onclick=e=>{e.stopPropagation();const nd=b.dataset.l==="de";if(nd===de)return;de=nd;SND.init();SND.play("click");rt();try{if(window.KSETLANG)KSETLANG(de?"de":"en");else{const k=JSON.parse(localStorage.getItem("nj_cfg")||"{}");k.lang=de?"de":"en";localStorage.setItem("nj_cfg",JSON.stringify(k))}}catch(er){}});
let dark=first?false:!(c.thU&&c.theme==="light");
const pos=()=>{const r=th.getBoundingClientRect(),s=sp.getBoundingClientRect();dk.style.setProperty("--cx",(r.left+r.width/2-s.left)+"px");dk.style.setProperty("--cy",(r.top+r.height/2-s.top)+"px")};
const paint=(d,anim)=>{try{let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement("meta");m.name="theme-color";document.head.appendChild(m)}m.content=d?"#0c1222":"#f3eee3"}catch(e){}if(anim&&d!==dark)SND.play(d?"night":"day");dark=d;pos();sw.classList.toggle("d",d);if(!anim)dk.style.transition="none";dk.classList.toggle("on",d);sp.classList.toggle("lt",!d);if(!anim){void dk.offsetWidth;dk.style.transition=""}};
paint(dark,false);

const sync=()=>{mu.innerHTML=window.KSPM===false?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'};sync();
mu.onclick=e=>{e.stopPropagation();window.KSPM=window.KSPM===false;sync();try{window.KMUTE&&KMUTE(!KSPM)}catch(e){}};

let started=0;const start=()=>{if(started)return;started=1;sp.classList.remove("gate");sfx();if(first){W(2300,()=>sp.classList.add("up"))}else{const end=()=>setTimeout(done,rm?400:2300);document.readyState==="complete"?end():addEventListener("load",end,{once:true});setTimeout(()=>sp.addEventListener("click",e=>{if(!e.target.closest(".ktb"))done()},{once:true}),50)}};
const gk=()=>{SND.init();start()};
if(first){let st=0;
$i("kgo").onclick=()=>{if(st)return done();st=1;SND.init();SND.play("tick");const g=$i("kgo");g.style.opacity="0";g.style.pointerEvents="none";
setTimeout(()=>{th.classList.add("pulse");tip.classList.add("on");SND.play("pop")},250);
setTimeout(()=>{if(!user){SND.play("click");paint(true,true)}},1500);
setTimeout(()=>{tip.classList.remove("on");th.classList.remove("pulse");gst=1;g.textContent=T("Weiter","Continue");g.style.opacity="";g.style.pointerEvents="";SND.play("pad")},3000)}}
else{$i("kgo").remove();sp.querySelector(".kin").remove();tip.remove()}
SND.init();
sp.addEventListener("pointerdown",()=>SND.init(),true);addEventListener("keydown",()=>SND.init(),{once:true});start();
mu.addEventListener("click",()=>{if(window.KSPM===false)start()});})();

function uiSnd(k){if(cfg.ui===false)return;try{if(!AU.ctx)auSetup();const c=AU.ctx;if(c.state!=="running")c.resume();const t0=c.currentTime+.01;const tone=(f,t,d,v,ty="sine")=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(KSFX(c));o.start(t);o.stop(t+d+.02)};if(k==="ok"){tone(880,t0,.18,.09);tone(1318.5,t0+.08,.28,.08)}else if(k==="bad"){tone(220,t0,.22,.07,"triangle");tone(196,t0+.1,.25,.06,"triangle")}else if(k==="rev"){tone(1568,t0,.12,.04);tone(2093,t0+.05,.16,.03)}}catch(e){}}

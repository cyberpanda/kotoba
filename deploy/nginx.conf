# Kotoba – nginx site config (static files from dist/web)
# Copy dist/web to /var/www/kotoba and include this file (or adapt `root`).
server {
    listen 80;
    server_name _;
    root /var/www/kotoba;
    index index.html;

    # correct MIME types for the PWA manifest and fonts
    types {
        application/manifest+json webmanifest;
        font/woff woff;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # hashed assets and fonts never change -> cache for a year
    location ~* ^/(assets|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # html, service worker and manifest must always be fresh so updates arrive
    location ~* (index\.html|sw\.js|manifest\.webmanifest|version\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
